<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:{{ACCENT}}}
body{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;
  font-family:'Cairo',Arial,sans-serif;
  background:radial-gradient(900px 700px at 85% 8%,{{ACCENT}}55,transparent 60%),
             linear-gradient(165deg,#0f1b33 0%,#070b14 65%)}
.pitch{position:absolute;inset:0;opacity:.07}
.mid{position:absolute;left:0;right:0;top:675px;height:6px;background:#fff}
.circle{position:absolute;width:520px;height:520px;border:6px solid #fff;border-radius:50%;left:280px;top:415px}
.stripe{position:absolute;top:-250px;width:110px;height:900px;background:var(--accent);opacity:.18;transform:rotate(25deg)}
.s1{right:230px}.s2{right:80px;opacity:.1}
.wrap{position:absolute;inset:0;padding:70px 76px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center}
.league{background:var(--accent);color:#06101f;font-weight:900;font-size:34px;padding:10px 28px;border-radius:8px;letter-spacing:2px}
.date{font-size:32px;font-weight:600;color:#cbd5e1}
.label{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:800;color:var(--accent);margin-bottom:30px}
.label:before{content:"";width:70px;height:6px;background:var(--accent)}
.title{font-family:{{FONT}};font-size:{{SIZE}}px;line-height:{{LH}};font-weight:{{WEIGHT}};
  text-transform:{{TRANSFORM}};display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:3px solid {{ACCENT}}66;padding-top:30px}
.brand{font-family:'Oswald',sans-serif;font-size:44px;font-weight:700;letter-spacing:4px;direction:ltr}
.brand span{color:var(--accent)}
.src{font-size:28px;color:#94a3b8;max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="pitch"><div class="mid"></div><div class="circle"></div></div>
<div class="stripe s1"></div><div class="stripe s2"></div>
<div class="wrap">
  <div class="top"><div class="league">{{LEAGUE}}</div><div class="date">{{DATE}}</div></div>
  <div>
    <div class="label">{{LABEL}}</div>
    <div class="title">{{TITLE}}</div>
  </div>
  <div class="foot"><div class="brand">GOALZONE<span>90</span></div><div class="src">{{SRCLABEL}}: {{SOURCE}}</div></div>
</div>
</body>
</html>
